name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set version
        run: |
          code=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=2.0.$code" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk "AVIP-GPSCam-${VERSION_NAME}.apk"

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:|What went wrong" -A4 build.log | head -60 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: AVIP-GPSCam-${{ env.VERSION_NAME }}-apk
          path: AVIP-GPSCam-${{ env.VERSION_NAME }}.apk

      # Phones check this release on launch and update themselves.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: AVIP GPSCam ${{ env.VERSION_NAME }}
          body: Automatic build from commit ${{ github.sha }}.
          files: AVIP-GPSCam-${{ env.VERSION_NAME }}.apk
          make_latest: true
